name: Trigger SupportQ Functional QA

on:
  push:
    branches: [main]

jobs:
  trigger-functional-qa:
    name: Trigger private Selenium regression suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger SupportQ-Automation
        env:
          GH_TOKEN: ${{ secrets.SUPPORTQ_AUTOMATION_PAT }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing SUPPORTQ_AUTOMATION_PAT repository secret."
            echo "Create a fine-grained token with Actions/Contents access to Joshuanoc/SupportQ-Automation and save it as SUPPORTQ_AUTOMATION_PAT in this repository."
            exit 1
          fi

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Joshuanoc/SupportQ-Automation/dispatches \
            -d "{\"event_type\":\"supportq-main-merged\",\"client_payload\":{\"source_sha\":\"${SOURCE_SHA}\",\"source_ref\":\"${SOURCE_REF}\"}}"
