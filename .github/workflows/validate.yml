name: SupportQ Functional Regression

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supportq-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Full functional regression and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run complete functional regression suite
        run: npm test

      - name: Verify production build
        run: npm run build
